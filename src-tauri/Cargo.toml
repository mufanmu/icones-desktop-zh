[package]
name = "tauri-app"
version = "0.1.13"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[dependencies.objc2]
version = "0.6"

[dependencies.objc2-foundation]
version = "0.3"
default-features = false
features = ["std", "NSData", "NSURL", "NSString", "NSArray", "NSGeometry", "NSObject"]

[dependencies.objc2-app-kit]
version = "0.3"
default-features = false
features = [
  "std",
  "NSDragging", "NSDraggingItem", "NSDraggingSession",
  "NSPasteboard", "NSPasteboardItem", "NSEvent", "NSImage",
  "NSWindow", "NSView", "NSGraphicsContext",
]

[dependencies.base64]
version = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSURL", "NSString", "NSArray", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSPasteboardItem", "NSEvent", "NSImage", "NSWindow", "NSView", "NSGraphicsContext"] }
base64 = "0.22"

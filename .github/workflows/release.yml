name: Release

# 打 tag（如 v0.1.5）即自动构建 macOS Universal .dmg 与 Windows .exe 并发到 Releases（草稿）。
# 发 tag 前请先把 src-tauri/tauri.conf.json、src-tauri/Cargo.toml 与 package.json 的 version 同步成该 tag，
# 否则产物文件名/版本号会与 Release 标题不一致。仅用 tag 触发（不加 workflow_dispatch：
# 手动触发时 github.ref_name 是分支名，会被当成版本号建出垃圾 Release）。
# 版本号必须为纯数字（如 0.1.5），不能带 -zh 等非数字后缀，否则 MSI 打包会失败。
#
# 打包策略（简单版）：
# - 包体资产名带版本号：Icones_0.1.5_universal.dmg / Icones_0.1.5_x64-setup.exe
# - 每次新版本 = 新版本号资产，旧版本资产保留（历史回退入口）
# - 下载入口：https://github.com/mufanmu/icones-desktop-zh/releases/latest
#   （自动跳转最新 Release 页面，用户在页面里下载对应版本包体）
# - 应用内自带更新检查（左下角版本检测），发现新版本跳转 Releases，用户自行升级
# - finalize 自动 make_latest=true + 发布（GitHub latest 按 commit 时间排序，需显式指定）
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 允许 tauri-action 创建 Release 并上传产物

jobs:
  build-macos-universal:
    runs-on: macos-latest # 现为 Apple Silicon 运行器，可交叉编译出 x86_64 分片
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (both mac targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build & release Universal .dmg
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 未做 Apple 签名 / 公证，故不设置签名相关 secrets。
        with:
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: "Icônes 中文版 ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build & release .exe
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 未做代码签名，故不设置签名相关 secrets。
        with:
          args: --target x86_64-pc-windows-msvc
          tagName: ${{ github.ref_name }}
          releaseName: "Icônes 中文版 ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

  finalize:
    needs: [build-macos-universal, build-windows]
    runs-on: ubuntu-latest
    steps:
      # GitHub 的 releases/latest 按 tag 指向的 commit 时间排序而非发布时间，
      # 且 tauri-action 不设置 make_latest，故显式把本次发布标记为 latest。
      - name: Mark release as latest + publish draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases?per_page=10" \
            --jq ".[] | select(.tag_name==\"${{ github.ref_name }}\") | .id")
          # 分两步：先发布草稿，再单独标记 latest（两者同一次 PATCH 时 make_latest 会被忽略）
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" \
            -f draft=false | jq -r '"published: " + .published_at + " tag: " + .tag_name'
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" \
            -f make_latest=true >/dev/null
